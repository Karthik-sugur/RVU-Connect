name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this runs on pull requests from forks, so it must never need secrets.
permissions:
  contents: read

jobs:
  test:
    name: Lint and Firestore rules tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator that the rules tests run against is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Parse every ES module
        run: npm run lint

      - name: Firestore rules tests
        run: npm run test:rules
